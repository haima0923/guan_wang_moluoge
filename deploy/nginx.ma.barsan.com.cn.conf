# HTTP staging virtual host. Add TLS for this hostname after DNS and certificate issuance.
# Inspect the existing Nginx installation and the application port before enabling.
server {
    listen 80;
    server_name ma.barsan.com.cn;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/barsan-ma-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
