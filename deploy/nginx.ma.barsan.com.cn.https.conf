server {
    listen 80;
    server_name ma.barsan.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/barsan-ma-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ma.barsan.com.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ma.barsan.com.cn;

    ssl_certificate /etc/nginx/ssl/ma.barsan.com.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ma.barsan.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BarsanMA:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
